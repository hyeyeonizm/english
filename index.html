<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>왕왕초보 하루 5단어</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #191f28;
      --sub: #6b7684;
      --muted: #8b95a1;
      --primary: #3182f6;
      --primary-soft: #e8f3ff;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #ef4444;
      --red-soft: #fee2e2;
      --border: #e5e8eb;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .title-wrap p {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--sub);
    }

    .progress-pill {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .progress-pill.done {
      background: var(--green-soft);
      color: var(--green);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #eceff4;
      padding: 4px;
      border-radius: 14px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px 6px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .panel.active {
      display: flex;
    }

    .day-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    .day-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }

    .day-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      white-space: nowrap;
    }

    .day-badge.done {
      background: var(--green-soft);
      color: var(--green);
    }

    /* Flashcard */
    .flashcard {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .badge-cat {
      background: #f2f4f6;
      color: var(--sub);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .card-center {
      text-align: center;
      padding: 18px 4px;
    }

    .word-en {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      word-break: break-word;
    }

    .word-read {
      margin: 8px 0 0;
      font-size: 16px;
      color: var(--sub);
      font-weight: 600;
    }

    .speak-btn {
      margin: 16px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .speak-btn:active {
      transform: scale(0.97);
    }

    .meaning-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: none;
    }

    .flashcard.revealed .meaning-box {
      display: block;
    }

    .word-ko {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }

    .phrase-box {
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }

    .phrase-en {
      font-weight: 700;
      color: var(--text);
    }

    .phrase-ko {
      margin-top: 3px;
      color: var(--sub);
      font-size: 13px;
    }

    .tap-hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .flashcard.revealed .tap-hint {
      display: none;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-nav {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-done {
      background: var(--primary);
      color: #fff;
    }

    .btn-done.is-done {
      background: var(--green-soft);
      color: var(--green);
    }

    /* Done Card */
    .done-screen {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 22px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .done-screen.show {
      display: flex;
    }

    .done-emoji {
      font-size: 52px;
      line-height: 1;
    }

    .done-title {
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }

    .done-desc {
      font-size: 14px;
      color: var(--sub);
      line-height: 1.6;
      margin: 0;
    }

    .done-btns {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-soft {
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text);
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary-small {
      border: none;
      background: var(--primary);
      color: #fff;
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* List (배운 단어만) */
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .list-item.is-done {
      border-color: #bbf7d0;
      background: #fafffb;
    }

    .list-main {
      flex: 1;
      min-width: 0;
    }

    .list-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .list-en {
      font-size: 19px;
      font-weight: 800;
    }

    .list-read {
      font-size: 13px;
      color: var(--muted);
    }

    .list-ko {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .list-phrase {
      margin-top: 4px;
      font-size: 13px;
      color: var(--sub);
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f9fafb;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    /* Quiz */
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .quiz-q {
      text-align: center;
      padding: 10px 0;
    }

    .quiz-word {
      font-size: 34px;
      font-weight: 800;
      margin: 0;
    }

    .quiz-read {
      margin-top: 6px;
      font-size: 15px;
      color: var(--sub);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .quiz-opt.correct {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .quiz-opt.wrong {
      background: var(--red-soft);
      border-color: var(--red);
      color: var(--red);
    }

    .quiz-feedback {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>🌱 하루 딱 5단어</h1>
        <p id="headerSub">오늘 몫만 끝내면 진짜 끝!</p>
      </div>
      <div class="progress-pill" id="progressPill">0 / 5</div>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="today">오늘의 5단어</button>
      <button class="tab-btn" data-tab="quiz">오늘 퀴즈</button>
      <button class="tab-btn" data-tab="review">배운 단어</button>
    </div>

    <!-- 오늘의 5단어 -->
    <section class="panel active" id="panel-today">
      <div class="day-banner">
        <div>
          <div class="day-title" id="dayTitle">Day 1 · 오늘의 5단어</div>
          <div class="day-sub" id="daySub">5개만 체크하면 오늘 공부 완료예요</div>
        </div>
        <div class="day-badge" id="dayBadge">0 / 5 완료</div>
      </div>

      <div id="todayStudyWrap" style="display:flex;flex-direction:column;gap:14px;">
        <div class="flashcard" id="flashcard">
          <div class="card-top">
            <span class="badge-cat" id="cardCat">기본 동사</span>
            <span id="cardCounter">1 / 5</span>
          </div>

          <div class="card-center">
            <p class="word-en" id="cardEn">go</p>
            <p class="word-read" id="cardRead">[고]</p>
            <button class="speak-btn" id="cardSpeak" type="button">🔊 발음 듣기</button>

            <div class="meaning-box">
              <p class="word-ko" id="cardKo">가다</p>
              <div class="phrase-box">
                <div class="phrase-en" id="cardPhraseEn">Let's go.</div>
                <div class="phrase-ko" id="cardPhraseKo">가자.</div>
              </div>
            </div>
          </div>

          <div class="tap-hint">카드를 누르면 뜻이 나와요 👇</div>
        </div>

        <div class="card-actions">
          <button class="btn btn-nav" id="prevBtn" type="button">← 이전</button>
          <button class="btn btn-done" id="doneBtn" type="button">외웠어요 ✓</button>
          <button class="btn btn-nav" id="nextBtn" type="button">다음 →</button>
        </div>
      </div>

      <div class="done-screen" id="doneScreen">
        <div class="done-emoji">🎉</div>
        <h2 class="done-title">오늘 할당량 끝!</h2>
        <p class="done-desc" id="doneDesc">
          오늘 5단어 다 끝내셨어요 👏<br />
          더 안 하셔도 되고, 내일 오시면 다음 5단어가 자동으로 열려요.
        </p>
        <div class="done-btns">
          <button class="btn-primary-small" id="goQuizBtn" type="button">오늘 5개 퀴즈 풀기</button>
          <button class="btn-soft" id="reopenTodayBtn" type="button">오늘 단어 다시 보기</button>
        </div>
      </div>
    </section>

    <!-- 오늘 퀴즈 -->
    <section class="panel" id="panel-quiz">
      <div class="quiz-card">
        <div class="card-top">
          <span class="badge-cat" id="quizCount">문제 1 / 5</span>
          <span id="quizScore">맞힌 개수: 0</span>
        </div>
        <div class="quiz-q">
          <p class="quiz-word" id="quizWord">go</p>
          <p class="quiz-read" id="quizRead">[고]</p>
          <button class="speak-btn" id="quizSpeak" type="button">🔊 발음 듣기</button>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="btn btn-done" id="quizNextBtn" type="button" style="display:none;">다음 문제 →</button>
      </div>
    </section>

    <!-- 배운 단어 (오늘까지 열린 것만) -->
    <section class="panel" id="panel-review">
      <div class="day-banner">
        <div>
          <div class="day-title">지금까지 연 단어</div>
          <div class="day-sub" id="reviewSub">오늘치까지만 보여드려요 (부담 X)</div>
        </div>
      </div>
      <div class="word-list" id="wordList"></div>
    </section>
  </div>

  <script>

    const STATE_KEY = "hyeyeon_daily5_state_v2";
    const DAILY_SIZE = 5;

    function safeGet(key, fallback) {
      try {
        const v = window.localStorage.getItem(key);
        return v ? JSON.parse(v) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSet(key, val) {
      try {
        window.localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {}
    }

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    const totalDays = Math.ceil(WORDS.length / DAILY_SIZE);
    let state = safeGet(STATE_KEY, {
      dayIndex: 0,           // 현재 진행 중인 Day (0부터 시작)
      lastDate: getTodayStr(),
      doneIds: [],
      reviewingToday: false
    });

    // 날짜가 바뀌었고, 이전 날 5단어를 다 끝냈다면 다음 날로 자동 이동!
    function syncDayForToday() {
      const today = getTodayStr();
      if (state.lastDate !== today) {
        const prevStart = state.dayIndex * DAILY_SIZE;
        const prevWords = WORDS.slice(prevStart, prevStart + DAILY_SIZE);
        const prevDone = prevWords.length > 0 && prevWords.every(w => state.doneIds.includes(w.id));
        if (prevDone) {
          state.dayIndex = (state.dayIndex + 1) % totalDays;
          if (state.dayIndex === 0) {
            state.doneIds = []; // 한 바퀴 다 돌았으면 새로 시작
          }
        }
        state.lastDate = today;
        state.reviewingToday = false;
        safeSet(STATE_KEY, state);
      }
    }

    syncDayForToday();

    let cardIdx = 0;
    let forceShowCards = false;

    function getTodayWords() {
      const start = state.dayIndex * DAILY_SIZE;
      return WORDS.slice(start, start + DAILY_SIZE);
    }

    function getUnlockedWords() {
      const end = (state.dayIndex + 1) * DAILY_SIZE;
      return WORDS.slice(0, end);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    // Tabs
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "quiz") startQuiz();
        if (btn.dataset.tab === "review") renderReview();
      };
    });

    const flashcard = document.getElementById("flashcard");
    flashcard.onclick = () => flashcard.classList.toggle("revealed");

    function renderToday() {
      const todayWords = getTodayWords();
      const doneCount = todayWords.filter(w => state.doneIds.includes(w.id)).length;
      const allDone = doneCount === todayWords.length;

      document.getElementById("dayTitle").textContent = `Day ${state.dayIndex + 1} · 오늘의 5단어`;
      document.getElementById("progressPill").textContent = `${doneCount} / ${todayWords.length}`;
      document.getElementById("progressPill").classList.toggle("done", allDone);
      document.getElementById("dayBadge").textContent = allDone ? "오늘 완료 🎉" : `${doneCount} / ${todayWords.length} 완료`;
      document.getElementById("dayBadge").classList.toggle("done", allDone);
      document.getElementById("daySub").textContent = allDone
        ? "할당량 끝! 내일 자정 이후 다음 5단어가 열려요"
        : "딱 5개만 체크하면 오늘 공부 끝이에요";

      const studyWrap = document.getElementById("todayStudyWrap");
      const doneScreen = document.getElementById("doneScreen");

      if (allDone && !forceShowCards) {
        studyWrap.style.display = "none";
        doneScreen.classList.add("show");
        return;
      }

      studyWrap.style.display = "flex";
      doneScreen.classList.remove("show");

      if (cardIdx >= todayWords.length) cardIdx = 0;
      if (cardIdx < 0) cardIdx = todayWords.length - 1;
      const w = todayWords[cardIdx];

      flashcard.classList.remove("revealed");
      document.getElementById("cardCat").textContent = w.cat;
      document.getElementById("cardCounter").textContent = `${cardIdx + 1} / ${todayWords.length}`;
      document.getElementById("cardEn").textContent = w.en;
      document.getElementById("cardRead").textContent = `[${w.read}]`;
      document.getElementById("cardKo").textContent = w.ko;
      document.getElementById("cardPhraseEn").textContent = w.pEn;
      document.getElementById("cardPhraseKo").textContent = w.pKo;

      const isDone = state.doneIds.includes(w.id);
      const doneBtn = document.getElementById("doneBtn");
      doneBtn.textContent = isDone ? "외움 완료 ✓" : "외웠어요 ✓";
      doneBtn.classList.toggle("is-done", isDone);

      document.getElementById("cardSpeak").onclick = (e) => {
        e.stopPropagation();
        speak(w.en);
      };

      doneBtn.onclick = () => {
        if (isDone) {
          state.doneIds = state.doneIds.filter(id => id !== w.id);
        } else {
          state.doneIds.push(w.id);
          // 다음 안 외운 단어로 자동 이동 (마지막이면 완료 화면으로!)
          const nextUndone = todayWords.findIndex((item, idx) => idx > cardIdx && !state.doneIds.includes(item.id));
          if (nextUndone !== -1) cardIdx = nextUndone;
        }
        forceShowCards = false;
        safeSet(STATE_KEY, state);
        renderToday();
      };
    }

    document.getElementById("prevBtn").onclick = () => {
      cardIdx--;
      renderToday();
    };

    document.getElementById("nextBtn").onclick = () => {
      cardIdx++;
      renderToday();
    };

    document.getElementById("reopenTodayBtn").onclick = () => {
      forceShowCards = true;
      cardIdx = 0;
      renderToday();
    };

    document.getElementById("goQuizBtn").onclick = () => {
      document.querySelector('[data-tab="quiz"]').click();
    };

    // Review (오늘까지 열린 단어만)
    function renderReview() {
      const unlocked = getUnlockedWords();
      document.getElementById("reviewSub").textContent = `지금까지 열린 ${unlocked.length}개만 보여드려요`;
      const wrap = document.getElementById("wordList");
      wrap.innerHTML = "";
      unlocked.slice().reverse().forEach(w => {
        const isDone = state.doneIds.includes(w.id);
        const item = document.createElement("div");
        item.className = "list-item" + (isDone ? " is-done" : "");
        item.innerHTML = `
          <div class="list-main">
            <div class="list-top">
              <span class="list-en">${w.en}</span>
              <span class="list-read">[${w.read}]</span>
            </div>
            <div class="list-ko">${w.ko}</div>
            <div class="list-phrase">${w.pEn} · ${w.pKo}</div>
          </div>
          <button class="icon-btn" type="button" aria-label="발음">🔊</button>
        `;
        item.querySelector("button").onclick = () => speak(w.en);
        wrap.appendChild(item);
      });
    }

    // Quiz (오늘의 5단어로만!)
    let quizList = [];
    let quizIdx = 0;
    let quizScore = 0;
    let quizAnswered = false;

    function startQuiz() {
      quizList = [...getTodayWords()].sort(() => Math.random() - 0.5);
      quizIdx = 0;
      quizScore = 0;
      renderQuiz();
    }

    function renderQuiz() {
      const q = quizList[quizIdx];
      quizAnswered = false;
      document.getElementById("quizCount").textContent = `문제 ${quizIdx + 1} / ${quizList.length}`;
      document.getElementById("quizScore").textContent = `맞힌 개수: ${quizScore}`;
      document.getElementById("quizWord").textContent = q.en;
      document.getElementById("quizRead").textContent = `[${q.read}]`;
      document.getElementById("quizFeedback").textContent = "";
      document.getElementById("quizNextBtn").style.display = "none";

      document.getElementById("quizSpeak").onclick = () => speak(q.en);

      const others = WORDS.filter(w => w.id !== q.id).sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = [q, ...others].sort(() => Math.random() - 0.5);

      const optWrap = document.getElementById("quizOptions");
      optWrap.innerHTML = "";
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "quiz-opt";
        btn.textContent = opt.ko;
        btn.onclick = () => {
          if (quizAnswered) return;
          quizAnswered = true;
          const all = optWrap.querySelectorAll(".quiz-opt");
          all.forEach((b, i) => {
            if (opts[i].id === q.id) b.classList.add("correct");
          });
          if (opt.id === q.id) {
            quizScore++;
            document.getElementById("quizScore").textContent = `맞힌 개수: ${quizScore}`;
            document.getElementById("quizFeedback").textContent = `정답! ${q.pEn} (${q.pKo})`;
            document.getElementById("quizFeedback").style.color = "var(--green)";
          } else {
            btn.classList.add("wrong");
            document.getElementById("quizFeedback").textContent = `아쉬워요! 뜻은 '${q.ko}'예요.`;
            document.getElementById("quizFeedback").style.color = "var(--red)";
          }
          const nextBtn = document.getElementById("quizNextBtn");
          nextBtn.style.display = "block";
          nextBtn.textContent = quizIdx + 1 < quizList.length ? "다음 문제 →" : "오늘 퀴즈 다시 풀기 ↻";
        };
        optWrap.appendChild(btn);
      });
    }

    document.getElementById("quizNextBtn").onclick = () => {
      if (quizIdx + 1 < quizList.length) {
        quizIdx++;
        renderQuiz();
      } else {
        startQuiz();
      }
    };

    renderToday();
  </script>
</body>
</html>
