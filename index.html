<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>왕왕초보 일상 영어 단어장</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #191f28;
      --sub: #6b7684;
      --muted: #8b95a1;
      --primary: #3182f6;
      --primary-soft: #e8f3ff;
      --green: #16a34a;
      --green-soft: #dcfce7;
      --red: #ef4444;
      --red-soft: #fee2e2;
      --border: #e5e8eb;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 2px;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .title-wrap p {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--sub);
    }

    .progress-pill {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #eceff4;
      padding: 4px;
      border-radius: 14px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 10px 6px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 700;
      color: var(--sub);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--card);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .cat-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .cat-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--sub);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    .panel.active {
      display: flex;
    }

    /* Flashcard */
    .flashcard {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
      user-select: none;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .badge-cat {
      background: #f2f4f6;
      color: var(--sub);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .card-center {
      text-align: center;
      padding: 18px 4px;
    }

    .word-en {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      word-break: break-word;
    }

    .word-read {
      margin: 8px 0 0;
      font-size: 16px;
      color: var(--sub);
      font-weight: 600;
    }

    .speak-btn {
      margin: 16px auto 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: #f9fafb;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .speak-btn:active {
      transform: scale(0.97);
    }

    .meaning-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
      display: none;
    }

    .flashcard.revealed .meaning-box {
      display: block;
    }

    .word-ko {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }

    .phrase-box {
      margin-top: 10px;
      background: #f8fafc;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }

    .phrase-en {
      font-weight: 700;
      color: var(--text);
    }

    .phrase-ko {
      margin-top: 3px;
      color: var(--sub);
      font-size: 13px;
    }

    .tap-hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .flashcard.revealed .tap-hint {
      display: none;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-nav {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-done {
      background: var(--primary);
      color: #fff;
    }

    .btn-done.is-done {
      background: var(--green-soft);
      color: var(--green);
    }

    .sub-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--sub);
      padding: 0 2px;
    }

    .text-btn {
      border: none;
      background: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 6px;
    }

    /* List */
    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list-item {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .list-item.is-done {
      border-color: #bbf7d0;
      background: #fafffb;
    }

    .list-main {
      flex: 1;
      min-width: 0;
    }

    .list-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .list-en {
      font-size: 19px;
      font-weight: 800;
    }

    .list-read {
      font-size: 13px;
      color: var(--muted);
    }

    .list-ko {
      margin-top: 4px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .list-phrase {
      margin-top: 4px;
      font-size: 13px;
      color: var(--sub);
    }

    .list-btns {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f9fafb;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .icon-btn.done {
      background: var(--green-soft);
      border-color: #86efac;
      color: var(--green);
      font-weight: 800;
    }

    /* Quiz */
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .quiz-q {
      text-align: center;
      padding: 10px 0;
    }

    .quiz-word {
      font-size: 34px;
      font-weight: 800;
      margin: 0;
    }

    .quiz-read {
      margin-top: 6px;
      font-size: 15px;
      color: var(--sub);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-opt {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }

    .quiz-opt.correct {
      background: var(--green-soft);
      border-color: var(--green);
      color: var(--green);
    }

    .quiz-opt.wrong {
      background: var(--red-soft);
      border-color: var(--red);
      color: var(--red);
    }

    .quiz-feedback {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>🌱 왕왕초보 일상 영어</h1>
        <p>하루 5단어만! 부담 없이 조금씩</p>
      </div>
      <div class="progress-pill" id="progressPill">0 / 0 완료</div>
    </header>

    <div id="jsWarning" style="background:#fff3cd;border:1px solid #ffeeba;color:#856404;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;">
      ⚠️ 지금 화면에서 버튼이 안 눌리면, 오른쪽 위 <strong>공유 버튼(□↑) → 'Safari에서 열기'</strong>로 열어 주세요! (앱 미리보기에서는 버튼 동작이 막힐 수 있어요)
    </div>

    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--text);">🎯 오늘 목표: <span id="todayCountText" style="color:var(--primary);">0 / 5단어</span></div>
        <div style="font-size:12px;color:var(--sub);margin-top:2px;" id="streakText">오늘 첫 5단어에 도전해 보세요!</div>
      </div>
      <div id="todayBadge" style="font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:#f2f4f6;color:var(--sub);white-space:nowrap;">진행 중</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="card">카드 보기</button>
      <button class="tab-btn" data-tab="list">전체 목록</button>
      <button class="tab-btn" data-tab="quiz">간단 퀴즈</button>
    </div>

    <div class="cat-scroll" id="catScroll"></div>

    <!-- 카드 보기 -->
    <section class="panel active" id="panel-card">
      <div class="flashcard" id="flashcard">
        <div class="card-top">
          <span class="badge-cat" id="cardCat">기본 동사</span>
          <span id="cardCounter">1 / 50</span>
        </div>

        <div class="card-center">
          <p class="word-en" id="cardEn">wait</p>
          <p class="word-read" id="cardRead">[웨이트]</p>
          <button class="speak-btn" id="cardSpeak" type="button">🔊 발음 듣기</button>

          <div class="meaning-box">
            <p class="word-ko" id="cardKo">기다리다</p>
            <div class="phrase-box">
              <div class="phrase-en" id="cardPhraseEn">Wait here.</div>
              <div class="phrase-ko" id="cardPhraseKo">여기서 기다려.</div>
            </div>
          </div>
        </div>

        <div class="tap-hint">카드를 누르면 뜻이 나와요 👇</div>
      </div>

      <div class="card-actions">
        <button class="btn btn-nav" id="prevBtn" type="button">← 이전</button>
        <button class="btn btn-done" id="doneBtn" type="button">외웠어요 ✓</button>
        <button class="btn btn-nav" id="nextBtn" type="button">다음 →</button>
      </div>

      <div class="sub-controls">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" id="hideDoneToggle" />
          안 외운 단어만 보기
        </label>
        <button class="text-btn" id="shuffleBtn" type="button">🔀 순서 섞기</button>
      </div>
    </section>

    <!-- 전체 목록 -->
    <section class="panel" id="panel-list">
      <input class="search-input" id="searchInput" type="search" placeholder="단어나 뜻 검색 (예: 먹다, coffee)" />
      <div class="word-list" id="wordList"></div>
    </section>

    <!-- 간단 퀴즈 -->
    <section class="panel" id="panel-quiz">
      <div class="quiz-card">
        <div class="card-top">
          <span class="badge-cat" id="quizCount">문제 1 / 10</span>
          <span id="quizScore">맞힌 개수: 0</span>
        </div>
        <div class="quiz-q">
          <p class="quiz-word" id="quizWord">eat</p>
          <p class="quiz-read" id="quizRead">[이트]</p>
          <button class="speak-btn" id="quizSpeak" type="button">🔊 발음 듣기</button>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-feedback" id="quizFeedback"></div>
        <button class="btn btn-done" id="quizNextBtn" type="button" style="display:none;">다음 문제 →</button>
      </div>
    </section>
  </div>

  <script>

      { id: 37, cat: "쇼핑 · 여행", en: "receipt", read: "리시트", ko: "영수증", pEn: "No receipt.", pKo: "영수증 괜찮아요." },
      { id: 38, cat: "쇼핑 · 여행", en: "here", read: "히어", ko: "여기", pEn: "Right here.", pKo: "바로 여기." },
      { id: 39, cat: "쇼핑 · 여행", en: "there", read: "데어", ko: "저기", pEn: "Over there.", pKo: "저기요." },
      { id: 40, cat: "쇼핑 · 여행", en: "left", read: "레프트", ko: "왼쪽", pEn: "Turn left.", pKo: "왼쪽으로 돌아." },
      { id: 41, cat: "쇼핑 · 여행", en: "right", read: "라이트", ko: "오른쪽 / 맞는", pEn: "Turn right.", pKo: "오른쪽으로 돌아." },
      { id: 42, cat: "쇼핑 · 여행", en: "station", read: "스테이션", ko: "역", pEn: "Subway station.", pKo: "지하철역." },

      // 5. 기분 · 상태 표현 (8개)
      { id: 43, cat: "기분 · 상태", en: "good", read: "굿", ko: "좋은", pEn: "Sounds good.", pKo: "좋네." },
      { id: 44, cat: "기분 · 상태", en: "bad", read: "배드", ko: "나쁜 / 안 좋은", pEn: "Not bad.", pKo: "나쁘지 않아." },
      { id: 45, cat: "기분 · 상태", en: "happy", read: "해피", ko: "행복한 / 기쁜", pEn: "I'm happy.", pKo: "나 기뻐." },
      { id: 46, cat: "기분 · 상태", en: "tired", read: "타이어드", ko: "피곤한", pEn: "I'm tired.", pKo: "나 피곤해." },
      { id: 47, cat: "기분 · 상태", en: "busy", read: "비지", ko: "바쁜", pEn: "I'm busy.", pKo: "나 바빠." },
      { id: 48, cat: "기분 · 상태", en: "hungry", read: "헝그리", ko: "배고픈", pEn: "I'm hungry.", pKo: "배고파." },
      { id: 49, cat: "기분 · 상태", en: "sorry", read: "쏘리", ko: "미안한", pEn: "I'm sorry.", pKo: "미안해요." },
      { id: 50, cat: "기분 · 상태", en: "thanks", read: "땡스", ko: "고마워요", pEn: "Thanks a lot.", pKo: "정말 고마워요." }
    ];

    const STORAGE_KEY = "hyeyeon_basic_vocab_done_v1";
    const DAILY_KEY = "hyeyeon_basic_vocab_daily_v1";

    // JS가 정상 실행되면 안내 배너 숨김
    const jsWarn = document.getElementById("jsWarning");
    if (jsWarn) jsWarn.style.display = "none";

    function safeGet(key, fallback) {
      try {
        const val = window.localStorage.getItem(key);
        return val ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSet(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        // 미리보기 등 localStorage 차단 환경에서는 메모리 상태로만 동작
      }
    }

    let doneIds = new Set(safeGet(STORAGE_KEY, []));
    let dailyState = safeGet(DAILY_KEY, {});
    let activeCat = "전체";
    let cardOrder = [...WORDS];
    let cardIdx = 0;

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    function ensureTodayState() {
      const today = getTodayStr();
      if (dailyState.date !== today) {
        const y = new Date();
        y.setDate(y.getDate() - 1);
        const yStr = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
        const prevStreak = (dailyState.date === yStr && (dailyState.count || 0) >= 5) ? (dailyState.streak || 0) : (dailyState.date === yStr ? (dailyState.streak || 0) : 0);
        dailyState = { date: today, count: 0, streak: prevStreak, goalReachedToday: false };
        safeSet(DAILY_KEY, dailyState);
      }
    }

    function recordTodayProgress(added) {
      ensureTodayState();
      dailyState.count = Math.max(0, (dailyState.count || 0) + (added ? 1 : -1));
      if (dailyState.count >= 5 && !dailyState.goalReachedToday) {
        dailyState.goalReachedToday = true;
        dailyState.streak = (dailyState.streak || 0) + 1;
      }
      safeSet(DAILY_KEY, dailyState);
    }

    function saveDone() {
      safeSet(STORAGE_KEY, [...doneIds]);
      updateProgress();
    }

    function updateProgress() {
      ensureTodayState();
      document.getElementById("progressPill").textContent = `${doneIds.size} / ${WORDS.length} 완료`;
      const c = Math.min(5, dailyState.count || 0);
      document.getElementById("todayCountText").textContent = `${c} / 5단어`;
      const badge = document.getElementById("todayBadge");
      const streakText = document.getElementById("streakText");
      if ((dailyState.count || 0) >= 5) {
        badge.textContent = "오늘 완료 🎉";
        badge.style.background = "var(--green-soft)";
        badge.style.color = "var(--green)";
        streakText.textContent = `연속 ${dailyState.streak || 1}일째 달성! 너무 잘하셨어요 👏`;
      } else {
        badge.textContent = `${5 - c}개 남음`;
        badge.style.background = "var(--primary-soft)";
        badge.style.color = "var(--primary)";
        streakText.textContent = dailyState.streak > 0 ? `현재 ${dailyState.streak}일 연속 달성 중!` : "오늘 5개만 체크하면 목표 완료!";
      }
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.85;
      window.speechSynthesis.speak(u);
    }

    // Categories
    const categories = ["전체", ...new Set(WORDS.map(w => w.cat))];
    const catScroll = document.getElementById("catScroll");
    function renderCats() {
      catScroll.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "cat-chip" + (activeCat === cat ? " active" : "");
        btn.textContent = cat;
        btn.onclick = () => {
          activeCat = cat;
          cardIdx = 0;
          renderCats();
          renderCard();
          renderList();
        };
        catScroll.appendChild(btn);
      });
    }

    function getFilteredWords(forCard = false) {
      let list = cardOrder.filter(w => activeCat === "전체" || w.cat === activeCat);
      if (forCard && document.getElementById("hideDoneToggle").checked) {
        const undone = list.filter(w => !doneIds.has(w.id));
        if (undone.length > 0) list = undone;
      }
      return list;
    }

    // Tabs
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "quiz") startQuiz();
      };
    });

    // Flashcard
    const flashcard = document.getElementById("flashcard");
    function renderCard() {
      const list = getFilteredWords(true);
      if (cardIdx >= list.length) cardIdx = 0;
      if (cardIdx < 0) cardIdx = list.length - 1;
      const w = list[cardIdx];

      flashcard.classList.remove("revealed");
      document.getElementById("cardCat").textContent = w.cat;
      document.getElementById("cardCounter").textContent = `${cardIdx + 1} / ${list.length}`;
      document.getElementById("cardEn").textContent = w.en;
      document.getElementById("cardRead").textContent = `[${w.read}]`;
      document.getElementById("cardKo").textContent = w.ko;
      document.getElementById("cardPhraseEn").textContent = w.pEn;
      document.getElementById("cardPhraseKo").textContent = w.pKo;

      const doneBtn = document.getElementById("doneBtn");
      const isDone = doneIds.has(w.id);
      doneBtn.textContent = isDone ? "외움 완료 ✓" : "외웠어요 ✓";
      doneBtn.classList.toggle("is-done", isDone);

      document.getElementById("cardSpeak").onclick = (e) => {
        e.stopPropagation();
        speak(w.en);
      };

      doneBtn.onclick = () => {
        const adding = !doneIds.has(w.id);
        if (adding) doneIds.add(w.id);
        else doneIds.delete(w.id);
        recordTodayProgress(adding);
        saveDone();
        renderCard();
        renderList();
      };
    }

    flashcard.onclick = () => {
      flashcard.classList.toggle("revealed");
    };

    document.getElementById("prevBtn").onclick = () => {
      cardIdx--;
      renderCard();
    };

    document.getElementById("nextBtn").onclick = () => {
      cardIdx++;
      renderCard();
    };

    document.getElementById("hideDoneToggle").onchange = () => {
      cardIdx = 0;
      renderCard();
    };

    document.getElementById("shuffleBtn").onclick = () => {
      cardOrder = [...WORDS].sort(() => Math.random() - 0.5);
      cardIdx = 0;
      renderCard();
    };

    // List
    const searchInput = document.getElementById("searchInput");
    searchInput.oninput = renderList;

    function renderList() {
      const q = searchInput.value.trim().toLowerCase();
      const list = WORDS.filter(w => {
        const catOk = activeCat === "전체" || w.cat === activeCat;
        const qOk = !q || w.en.toLowerCase().includes(q) || w.ko.includes(q) || w.read.includes(q);
        return catOk && qOk;
      });

      const wrap = document.getElementById("wordList");
      wrap.innerHTML = "";
      list.forEach(w => {
        const isDone = doneIds.has(w.id);
        const item = document.createElement("div");
        item.className = "list-item" + (isDone ? " is-done" : "");
        item.innerHTML = `
          <div class="list-main">
            <div class="list-top">
              <span class="list-en">${w.en}</span>
              <span class="list-read">[${w.read}]</span>
            </div>
            <div class="list-ko">${w.ko}</div>
            <div class="list-phrase">${w.pEn} · ${w.pKo}</div>
          </div>
          <div class="list-btns">
            <button class="icon-btn" type="button" aria-label="발음">🔊</button>
            <button class="icon-btn ${isDone ? "done" : ""}" type="button" aria-label="완료">✓</button>
          </div>
        `;
        const [speakBtn, checkBtn] = item.querySelectorAll("button");
        speakBtn.onclick = () => speak(w.en);
        checkBtn.onclick = () => {
          const adding = !doneIds.has(w.id);
          if (adding) doneIds.add(w.id);
          else doneIds.delete(w.id);
          recordTodayProgress(adding);
          saveDone();
          renderList();
          renderCard();
        };
        wrap.appendChild(item);
      });
    }

    // Quiz
    let quizList = [];
    let quizIdx = 0;
    let quizScore = 0;
    let quizAnswered = false;

    function startQuiz() {
      const pool = activeCat === "전체" ? WORDS : WORDS.filter(w => w.cat === activeCat);
      quizList = [...pool].sort(() => Math.random() - 0.5).slice(0, Math.min(10, pool.length));
      quizIdx = 0;
      quizScore = 0;
      renderQuiz();
    }

    function renderQuiz() {
      const q = quizList[quizIdx];
      quizAnswered = false;
      document.getElementById("quizCount").textContent = `문제 ${quizIdx + 1} / ${quizList.length}`;
      document.getElementById("quizScore").textContent = `맞힌 개수: ${quizScore}`;
      document.getElementById("quizWord").textContent = q.en;
      document.getElementById("quizRead").textContent = `[${q.read}]`;
      document.getElementById("quizFeedback").textContent = "";
      document.getElementById("quizNextBtn").style.display = "none";

      document.getElementById("quizSpeak").onclick = () => speak(q.en);

      const others = WORDS.filter(w => w.id !== q.id).sort(() => Math.random() - 0.5).slice(0, 3);
      const opts = [q, ...others].sort(() => Math.random() - 0.5);

      const optWrap = document.getElementById("quizOptions");
      optWrap.innerHTML = "";
      opts.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "quiz-opt";
        btn.textContent = opt.ko;
        btn.onclick = () => {
          if (quizAnswered) return;
          quizAnswered = true;
          const all = optWrap.querySelectorAll(".quiz-opt");
          all.forEach((b, i) => {
            if (opts[i].id === q.id) b.classList.add("correct");
          });
          if (opt.id === q.id) {
            quizScore++;
            document.getElementById("quizScore").textContent = `맞힌 개수: ${quizScore}`;
            document.getElementById("quizFeedback").textContent = `정답! ${q.pEn} (${q.pKo})`;
            document.getElementById("quizFeedback").style.color = "var(--green)";
          } else {
            btn.classList.add("wrong");
            document.getElementById("quizFeedback").textContent = `아쉬워요! 뜻은 '${q.ko}'예요.`;
            document.getElementById("quizFeedback").style.color = "var(--red)";
          }
          const nextBtn = document.getElementById("quizNextBtn");
          nextBtn.style.display = "block";
          nextBtn.textContent = quizIdx + 1 < quizList.length ? "다음 문제 →" : "새 퀴즈 풀기 ↻";
        };
        optWrap.appendChild(btn);
      });
    }

    document.getElementById("quizNextBtn").onclick = () => {
      if (quizIdx + 1 < quizList.length) {
        quizIdx++;
        renderQuiz();
      } else {
        startQuiz();
      }
    };

    updateProgress();
    renderCats();
    renderCard();
    renderList();
  </script>
</body>
</html>
